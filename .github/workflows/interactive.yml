name: Interactive AI Lab Server
on:
  workflow_dispatch:

jobs:
  run-interactive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy ccxt ta python-dotenv requests llmf
      - name: Extract Code
        run: tar -xzvf code.tar.gz
      - name: Copy missing modules
        run: cp tools/agent_dev/llm_backend.py .
      - name: Create symlink
        run: |
          rm -rf /home/runner/quantum_lab_sandbox
          ln -s $GITHUB_WORKSPACE /home/runner/quantum_lab_sandbox

      - name: Install upterm and save SSH link
        run: |
          curl -sL https://github.com/owenthereal/upterm/releases/latest/download/upterm_linux_amd64.tar.gz | tar xz
          sudo mv upterm /usr/local/bin/
          
          # ДОБАВЛЕН ФЛАГ --skip-host-key-check
          echo "Запускаю upterm..."
          upterm host --accept --skip-host-key-check > /dev/null 2> raw_link.txt &
          
          for i in {1..30}; do
            if grep -q "ssh " raw_link.txt; then
              break
            fi
            sleep 2
          done
          
          SSH_LINK=$(grep "ssh " raw_link.txt | head -n 1)
          echo "$SSH_LINK" > ssh_link.txt
          
          echo "=== Сгенерированная ссылка ==="
          cat ssh_link.txt
          
          if [ -s ssh_link.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ssh_link.txt
            git commit -m "Update SSH link (upterm fixed)"
            git push
          else
            echo "Ссылка не сгенерировалась!"
            exit 1
          fi

      - name: Keep alive
        run: sleep 7200
