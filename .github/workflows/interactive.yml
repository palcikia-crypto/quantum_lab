name: Interactive AI Lab Server
on:
  workflow_dispatch:

jobs:
  run-interactive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # Разрешаем пушить файл со ссылкой
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy ccxt ta python-dotenv requests llmf
      - name: Extract Code
        run: tar -xzvf code.tar.gz
      - name: Copy missing modules
        run: cp tools/agent_dev/llm_backend.py .
      - name: Create symlink
        run: |
          rm -rf /home/runner/quantum_lab_sandbox
          ln -s $GITHUB_WORKSPACE /home/runner/quantum_lab_sandbox
          
      - name: Start tmate and save link
        run: |
          sudo apt-get install -y tmate
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          # Вытаскиваем SSH ссылку
          SSH_LINK=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          echo "Ссылка: $SSH_LINK"
          echo "$SSH_LINK" > ssh_link.txt
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ssh_link.txt
          git commit -m "Update SSH link"
          git push
          
      - name: Keep alive
        run: sleep 7200 # Держим сервер открытым 2 часа
