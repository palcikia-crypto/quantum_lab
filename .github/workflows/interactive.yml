name: Interactive AI Lab Server
on:
  workflow_dispatch: # Запускается только вручную

jobs:
  run-interactive:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # Сервер будет жить 2 часа
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy ccxt ta python-dotenv requests llmf
      - name: Extract Code
        run: tar -xzvf code.tar.gz
      - name: Copy missing modules
        run: cp tools/agent_dev/llm_backend.py .
      - name: Create symlink for hardcoded paths
        run: |
          rm -rf /home/runner/quantum_lab_sandbox
          ln -s $GITHUB_WORKSPACE /home/runner/quantum_lab_sandbox
          
      # ЭТОТ ШАГ ОСТАНАВЛИВАЕТ СЕРВЕР И ДАЕТ ССЫЛКУ ДЛЯ SSH
      - name: Setup SSH Session (tmate)
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
