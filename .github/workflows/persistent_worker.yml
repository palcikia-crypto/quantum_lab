name: Persistent Hot-Reload Worker
on:
  workflow_dispatch:
    inputs:
      script_name:
        required: true
        default: 'core/okx_bot_paper_v4.py'
  schedule:
    - cron: '7 */6 * * *'

concurrency:
  group: trading-worker
  cancel-in-progress: true

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pandas numpy ccxt ta python-dotenv requests
      - name: Run Worker with API logging
        env:
          SCRIPT_NAME: ${{ inputs.script_name || 'core/okx_bot_paper_v4.py' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -b logs || git checkout logs
          git push origin logs 2>/dev/null || true
          
          # code.tar.gz больше НЕ распаковываем — он затирал свежий код из git
          rm -rf /home/runner/quantum_lab_sandbox /home/runner/quantum_lab || true
          ln -s $GITHUB_WORKSPACE /home/runner/quantum_lab || true
          ln -s $GITHUB_WORKSPACE /home/runner/quantum_lab_sandbox || true
          
          mkdir -p data god_backups logs
          touch data/market.db
          
          push_log() {
            local LINE="$1"
            local SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/palcikia-crypto/quantum_lab/contents/live.log?ref=logs" | jq -r '.sha // empty')
            local B64OLD=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/palcikia-crypto/quantum_lab/contents/live.log?ref=logs" | jq -r '.content // empty' | tr -d '\n')
            local OLD=""
            if [ -n "$B64OLD" ]; then
              OLD=$(echo "$B64OLD" | base64 -d 2>/dev/null | tail -n 150)
            fi
            local NEW="$LINE"
            if [ -n "$OLD" ]; then
              NEW="$OLD"$'\n'"$LINE"
            fi
            local B64=$(printf '%s' "$NEW" | base64 -w0)
            local JSON="{\"message\": \"Log update\", \"content\": \"$B64\", \"branch\": \"logs\""
            if [ -n "$SHA" ]; then
              JSON="$JSON, \"sha\": \"$SHA\""
            fi
            JSON="$JSON}"
            curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$JSON" \
              "https://api.github.com/repos/palcikia-crypto/quantum_lab/contents/live.log" > /dev/null
          }
          
          push_log "🟢 Воркер стартовал: $SCRIPT_NAME"
          push_log "🟢 Запускаю сборщик рыночных данных OKX"
          
          # Сборщик стакана в фоне — бот торгует по этим данным
          nohup python -u core/okx_feed.py > logs/okx_feed_stdout.log 2>&1 &
          echo $! > /tmp/feed.pid
          
          # Даем сборщику наполнить базу
          sleep 10
          
          push_log "🟢 Сборщик: $(tail -1 logs/okx_feed_stdout.log 2>/dev/null || echo запущен)"
          
          python -u $SCRIPT_NAME 2>&1 | while IFS= read -r line; do
            echo "$line"
            push_log "$line"
          done
          
          kill $(cat /tmp/feed.pid) 2>/dev/null || true
          push_log "— последние строки сборщика —"
          tail -n 3 logs/okx_feed_stdout.log 2>/dev/null | while IFS= read -r line; do push_log "$line"; done
          push_log "🔴 Бот завершил работу"
      - name: Self-restart (бесконечный цикл)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "♻️ Перезапускаю воркер"
          sleep 30
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/palcikia-crypto/quantum_lab/actions/workflows/persistent_worker.yml/dispatches" \
            -d '{"ref":"master","inputs":{"script_name":"core/okx_bot_paper_v4.py"}}' || true
          echo "done"
