name: Persistent Hot-Reload Worker
on:
  workflow_dispatch:
    inputs:
      script_name:
        required: true
        default: 'core/okx_bot_paper_v4.py'

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pandas numpy ccxt ta python-dotenv requests llmf
      - name: Run Worker with ntfy stream
        env:
          SCRIPT_NAME: ${{ inputs.script_name }}
          NTFY_TOPIC: palcikia-qlab-2026
        run: |
          notify() { curl -s -d "$1" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null 2>&1 || true; }
          notify "🟢 Воркер стартовал: $SCRIPT_NAME"
          
          tar -xzf code.tar.gz >/dev/null 2>&1 || true
          rm -rf /home/runner/quantum_lab_sandbox || true
          ln -s $GITHUB_WORKSPACE /home/runner/quantum_lab_sandbox || true
          
          # Запускаем бота, каждую строку сразу шлём в ntfy
          python -u $SCRIPT_NAME 2>&1 | while IFS= read -r line; do
            echo "$line"
            notify "$line"
          done
          
          notify "🔴 Бот завершил работу"
