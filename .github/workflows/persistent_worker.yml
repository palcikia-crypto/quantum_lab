name: Persistent Hot-Reload Worker
on:
  workflow_dispatch:
    inputs:
      script_name:
        required: true
        default: 'core/okx_bot_paper_v4.py'
  schedule:
    # Страховочный перезапуск каждые 6 часов (если цепочка само-перезапусков прервётся)
    - cron: '7 */6 * * *'

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pandas numpy ccxt ta python-dotenv requests llmf
      - name: Run Worker with API logging
        env:
          SCRIPT_NAME: ${{ inputs.script_name || 'core/okx_bot_paper_v4.py' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Создаем ветку logs, если её нет
          git checkout -b logs || git checkout logs
          git push origin logs 2>/dev/null || true
          
          tar -xzf code.tar.gz >/dev/null 2>&1 || true
          rm -rf /home/runner/quantum_lab_sandbox || true
          ln -s $GITHUB_WORKSPACE /home/runner/quantum_lab_sandbox || true
          
          # Создаем папки и пустую базу, если их нет
          mkdir -p data god_backups
          touch data/market.db
          
          push_log() {
            local LINE="$1"
            local B64=$(echo -n "$LINE" | base64 -w0)
            local SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \\
              "https://api.github.com/repos/palcikia-crypto/quantum_lab/contents/live.log?ref=logs" | jq -r '.sha // empty')
            
            local JSON="{\"message\": \"Log update\", \"content\": \"$B64\", \"branch\": \"logs\""
            if [ -n "$SHA" ]; then
              JSON="$JSON, \"sha\": \"$SHA\""
            fi
            JSON="$JSON}"
            
            curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" \\
              -H "Content-Type: application/json" \\
              -d "$JSON" \\
              "https://api.github.com/repos/palcikia-crypto/quantum_lab/contents/live.log" > /dev/null
          }
          
          push_log "🟢 Воркер стартовал: $SCRIPT_NAME"
          
          python -u $SCRIPT_NAME 2>&1 | while IFS= read -r line; do
            echo "$line"
            push_log "$line"
          done
          
          push_log "🔴 Бот завершил работу"
      - name: Self-restart (бесконечный цикл)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          push_log() {
            local LINE="$1"
            local B64=$(echo -n "$LINE" | base64 -w0)
            local SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \\
              "https://api.github.com/repos/palcikia-crypto/quantum_lab/contents/live.log?ref=logs" | jq -r '.sha // empty')
            local JSON="{\"message\": \"Log update\", \"content\": \"$B64\", \"branch\": \"logs\""
            if [ -n "$SHA" ]; then JSON="$JSON, \"sha\": \"$SHA\""; fi
            JSON="$JSON}"
            curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" \\
              -H "Content-Type: application/json" \\
              -d "$JSON" \\
              "https://api.github.com/repos/palcikia-crypto/quantum_lab/contents/live.log" > /dev/null
          }
          push_log "♻️ Перезапускаю воркер (бесконечный цикл)"
          sleep 30
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \\
            -H "Accept: application/vnd.github+json" \\
            https://api.github.com/repos/palcikia-crypto/quantum_lab/actions/workflows/persistent_worker.yml/dispatches \\
            -d '{"ref":"master","inputs":{"script_name":"core/okx_bot_paper_v4.py"}}' || true
