name: Persistent Hot-Reload Worker
on:
  workflow_dispatch:
    inputs:
      script_name:
        required: true
        default: 'core/okx_bot_paper_v4.py'

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pandas numpy ccxt ta python-dotenv requests llmf
      
      - name: Run Hot-Reload Worker
        env:
          SCRIPT_NAME: ${{ inputs.script_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Создаем отдельную ветку для логов
          git checkout -b logs || git checkout logs
          
          LAST_HASH=""
          BOT_PID=""
          
          while true; do
            # Берем код из master
            git fetch origin master >/dev/null 2>&1 || true
            git checkout origin/master -- code.tar.gz >/dev/null 2>&1 || true
            
            tar -xzf code.tar.gz >/dev/null 2>&1 || true
            rm -rf /home/runner/quantum_lab_sandbox || true
            ln -s $GITHUB_WORKSPACE /home/runner/quantum_lab_sandbox || true
            
            CURRENT_HASH=$(md5sum code.tar.gz 2>/dev/null | awk '{print $1}' || true)
            
            if [ "$CURRENT_HASH" != "$LAST_HASH" ]; then
              LAST_HASH="$CURRENT_HASH"
              
              if [ -n "$BOT_PID" ] && kill -0 $BOT_PID 2>/dev/null; then
                kill -9 $BOT_PID 2>/dev/null || true
              fi
              
              echo "🚀 Запускаю: $SCRIPT_NAME"
              nohup python -u $SCRIPT_NAME > live.log 2>&1 &
              BOT_PID=$!
            fi
            
            # Пушим логи в ветку logs
            if [ -f live.log ]; then
              git add live.log || true
              git commit -m "Log update $(date +%H:%M:%S)" || true
              git push origin logs -f >/dev/null 2>&1 || true
            fi
            
            sleep 15
          done
