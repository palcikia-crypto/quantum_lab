name: Quantum Lab Bot
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-quantum:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy ccxt ta python-dotenv requests llmf
      - name: Extract Code
        run: tar -xzvf code.tar.gz
      - name: Copy missing modules
        run: cp tools/agent_dev/llm_backend.py .
      - name: Create symlink for hardcoded paths
        run: |
          rm -rf /home/runner/quantum_lab_sandbox
          ln -s $GITHUB_WORKSPACE /home/runner/quantum_lab_sandbox
      - name: Run Quantum Agent
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET: ${{ secrets.BINANCE_SECRET }}
        run: |
          # Запускаем бота и одновременно пишем вывод в файл bot_output.log
          python -u god_agent_v4.py | tee bot_output.log
      - name: Commit results and logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot_output.log data/ tools/ *.json index.html || true
          git commit -m "Auto-save: AI logs and strategies $(date -u)" || true
          git pull --rebase || true
          git push || true
